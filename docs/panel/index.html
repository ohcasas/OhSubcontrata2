<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Documentación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --fondo:#EEF0F3; --papel:#fff; --tinta:#16202C; --suave:#5B6775; --linea:#D5DAE0; --linea2:#E7EBEF; --cab:#F7F8FA;
    --barra:#111B2B; --barra-texto:#B4C0D0; --azul:#1747C4; --azul-hover:#10389F;
    --ok:#18794E; --aviso:#935700; --mal:#B42318;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--fondo); color:var(--tinta); font:14px/1.45 'IBM Plex Sans',Inter,system-ui,sans-serif; font-variant-numeric:tabular-nums; }
  button,input,select,textarea { font:inherit; color:inherit; }
  a { color:var(--azul); }
  :focus-visible { outline:2px solid var(--azul); outline-offset:2px; }
  .hidden { display:none !important; }
  h1 { font-size:21px; font-weight:600; margin:0; line-height:1.25; }
  h2 { font-size:14px; font-weight:600; margin:0; }
  .suave { color:var(--suave); } .peq { font-size:12.5px; }

  /* Acceso */
  .centro { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .acceso { width:100%; max-width:360px; background:var(--papel); border:1px solid var(--linea); border-radius:6px; padding:28px; }
  .acceso h1 { font-size:19px; } .acceso p { margin:4px 0 0; }
  label.campo { display:block; font-weight:500; margin:16px 0 5px; }
  input[type=text],input[type=email],input[type=password],input[type=date],input[type=search],input[type=number],select,textarea {
    width:100%; padding:8px 10px; border:1px solid #B5BDC8; border-radius:4px; background:#fff; }
  textarea { min-height:84px; resize:vertical; }

  /* Botones */
  .btn { display:inline-flex; align-items:center; justify-content:center; padding:6px 12px; border:1px solid #B5BDC8; border-radius:4px; background:#fff; cursor:pointer; font-weight:500; white-space:nowrap; }
  .btn:hover { background:#F1F4F8; }
  .btn.primario { background:var(--azul); border-color:var(--azul); color:#fff; } .btn.primario:hover { background:var(--azul-hover); }
  .btn.mal { color:var(--mal); border-color:#E0B4B0; } .btn.mal:hover { background:#FDF1F0; }
  .btn.peq { padding:3px 9px; font-size:12.5px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .ancho { width:100%; margin-top:20px; padding:9px 12px; }

  /* Barra superior */
  .barra { background:var(--barra); color:#fff; display:flex; align-items:stretch; gap:28px; padding:0 24px; height:48px; position:sticky; top:0; z-index:20; }
  .marca { display:flex; align-items:center; font-weight:600; white-space:nowrap; color:#fff; text-decoration:none; }
  .marca:hover span { color:#fff; }
  /* Barras de desplazamiento discretas; la del menú superior se oculta (se sigue pudiendo deslizar) */
  * { scrollbar-width:thin; scrollbar-color:#C3CCD8 transparent; }
  .barra nav { scrollbar-width:none; } .barra nav::-webkit-scrollbar { display:none; }
  ::-webkit-scrollbar { height:8px; width:8px; } ::-webkit-scrollbar-thumb { background:#C3CCD8; border-radius:4px; } ::-webkit-scrollbar-track { background:transparent; }
  .marca span { font-weight:400; color:var(--barra-texto); margin-left:12px; padding-left:12px; border-left:1px solid #38485F; }
  .barra nav { display:flex; gap:22px; overflow-x:auto; flex:1; }
  .barra nav a { color:var(--barra-texto); text-decoration:none; display:flex; align-items:center; gap:7px; border-bottom:2px solid transparent; padding-top:2px; white-space:nowrap; }
  .barra nav a:hover { color:#fff; } .barra nav a.activo { color:#fff; border-bottom-color:#fff; }
  .n { background:var(--mal); color:#fff; font-size:11.5px; font-weight:600; border-radius:3px; padding:0 6px; line-height:18px; }
  .usuario { display:flex; align-items:center; gap:12px; color:var(--barra-texto); white-space:nowrap; font-size:13px; }
  .usuario button { background:transparent; border:1px solid #38485F; color:#fff; border-radius:4px; padding:3px 10px; cursor:pointer; }
  #vista { max-width:1280px; margin:0 auto; padding:24px 24px 64px; }
  @media (max-width:1050px) { .barra { gap:18px; padding:0 16px; } .barra nav { gap:16px; } .usuario .nombre { display:none; } }
  @media (max-width:760px) { .barra { padding:0 12px; gap:14px; height:auto; flex-wrap:wrap; } .marca, .usuario { height:48px; } .usuario { margin-left:auto; } .barra nav { order:3; flex:0 0 100%; height:40px; border-top:1px solid #243247; gap:18px; } .marca span, .usuario .nombre { display:none; } #vista { padding:16px 12px 56px; } }

  /* Estructura de página */
  .cab { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
  .cab p { margin:3px 0 0; }
  .miga { font-size:12.5px; margin-bottom:8px; } .miga a { text-decoration:none; }
  .panel { background:var(--papel); border:1px solid var(--linea); border-radius:4px; }
  .panel > header { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid var(--linea); gap:12px; }
  .panel .cuerpo { padding:14px; }
  .dos { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; margin-top:16px; }
  .ficha { display:grid; grid-template-columns:290px minmax(0,1fr); gap:16px; align-items:start; }
  @media (max-width:980px) { .dos, .ficha { grid-template-columns:1fr; } }
  dl.datos { margin:0; } dl.datos div { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--linea2); }
  dl.datos div:last-child { border-bottom:none; } dl.datos dt { color:var(--suave); } dl.datos dd { margin:0; text-align:right; word-break:break-word; }
  .herramientas { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px; align-items:center; }
  .herramientas input[type=search] { flex:1 1 240px; max-width:380px; } .herramientas select { width:auto; }
  .resumen { display:flex; background:var(--papel); border:1px solid var(--linea); border-radius:4px; overflow-x:auto; }
  .resumen a { flex:1 0 140px; padding:12px 16px; text-decoration:none; color:inherit; border-right:1px solid var(--linea2); }
  .resumen a:last-child { border-right:none; } .resumen a:hover { background:#F7F9FD; }
  .resumen b { display:block; font-size:24px; font-weight:600; line-height:1.2; } .resumen span { color:var(--suave); font-size:12.5px; }
  .resumen b.mal { color:var(--mal); }
  .reparto { display:flex; height:10px; border-radius:2px; overflow:hidden; background:var(--linea2); margin:12px 0 10px; }
  .reparto i { display:block; } .leyenda { display:flex; gap:20px; flex-wrap:wrap; }
  .pestanas { display:flex; gap:20px; border-bottom:1px solid var(--linea); padding:0 14px; overflow-x:auto; }
  .pestanas button { background:none; border:none; padding:11px 0 9px; cursor:pointer; color:var(--suave); font-weight:500; border-bottom:2px solid transparent; white-space:nowrap; }
  .pestanas button.activa { color:var(--tinta); border-bottom-color:var(--tinta); }
  .vacio { padding:28px 14px; color:var(--suave); text-align:center; }

  /* Estados */
  .e { display:inline-flex; align-items:center; gap:7px; white-space:nowrap; font-weight:500; }
  .e::before { content:''; width:8px; height:8px; flex-shrink:0; background:currentColor; }
  .e.ok { color:var(--ok); } .e.aviso { color:var(--aviso); } .e.mal { color:var(--mal); }
  .e.falta { color:var(--mal); } .e.falta::before { background:transparent; border:1.5px solid currentColor; }
  .e.neutro { color:var(--suave); }
  .mal-t { color:var(--mal); } .aviso-t { color:var(--aviso); }

  /* Tablas */
  .tabla-caja { overflow-x:auto; }
  table.t { width:100%; border-collapse:collapse; }
  .t th { text-align:left; font-weight:600; font-size:12.5px; color:var(--suave); padding:8px 14px; border-bottom:1px solid var(--linea); background:var(--cab); white-space:nowrap; }
  .t th[data-ord] { cursor:pointer; user-select:none; } .t th[data-ord]:hover { color:var(--tinta); }
  .t th[aria-sort=ascending]::after { content:' ↑'; } .t th[aria-sort=descending]::after { content:' ↓'; }
  .t td { padding:9px 14px; border-bottom:1px solid var(--linea2); vertical-align:top; }
  .t tr:last-child td { border-bottom:none; }
  .t tr.clic { cursor:pointer; } .t tr.clic:hover td { background:#F5F8FE; }
  .t td.der, .t th.der { text-align:right; } .t td.acc { white-space:nowrap; text-align:right; } .t td.acc .btn { margin-left:4px; }
  .t .sub { display:block; color:var(--suave); font-size:12.5px; }
  .t td b { font-weight:600; }
  @media (max-width:760px) {
    .t thead { display:none; } .t, .t tbody, .t tr, .t td { display:block; width:100%; }
    .t tr { padding:8px 0; border-bottom:1px solid var(--linea); } .t tr:last-child { border-bottom:none; }
    .t td { border:none; padding:3px 14px; display:flex; gap:10px; justify-content:space-between; text-align:right; }
    .t td::before { content:attr(data-l); color:var(--suave); text-align:left; flex-shrink:0; }
    .t td.prim { text-align:left; display:block; } .t td.prim::before { content:none; }
    .t td.acc { justify-content:flex-start; flex-wrap:wrap; text-align:left; } .t td.acc::before { content:none; } .t td.acc .btn { margin:4px 6px 0 0; }
  }

  /* Ventana y avisos */
  #velo { position:fixed; inset:0; background:rgba(17,27,43,.5); z-index:50; display:flex; align-items:flex-start; justify-content:center; padding:8vh 16px; overflow-y:auto; }
  #ventana { background:#fff; border-radius:6px; width:100%; max-width:500px; padding:22px; border:1px solid var(--linea); }
  #ventana h2 { font-size:17px; margin-bottom:6px; } .pie-modal { display:flex; gap:8px; justify-content:flex-end; margin-top:20px; flex-wrap:wrap; }
  .form-rejilla { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; } @media (max-width:520px) { .form-rejilla { grid-template-columns:1fr; } }
  .error-caja { border:1px solid #E0B4B0; background:#FDF1F0; color:var(--mal); padding:9px 12px; border-radius:4px; margin-top:14px; }
  #aviso { position:fixed; left:24px; bottom:24px; background:var(--tinta); color:#fff; padding:10px 16px; border-radius:4px; z-index:60; max-width:calc(100vw - 48px); }
  #aviso.error { background:var(--mal); }
  .cargando { padding:40px 0; color:var(--suave); }
</style>
</head>
<body>

<div id="config" class="centro hidden">
  <form class="acceso" id="form-config">
    <h1>Conectar con Supabase</h1>
    <p class="suave">Son los datos del proyecto (Supabase → Project Settings → API). Se guardan solo en este navegador.</p>
    <label class="campo" for="cfg-url">URL del proyecto</label>
    <input type="text" id="cfg-url" placeholder="https://xxxx.supabase.co" />
    <label class="campo" for="cfg-key">Clave anon (pública)</label>
    <input type="text" id="cfg-key" placeholder="eyJ…" />
    <button class="btn primario ancho" type="submit">Guardar y continuar</button>
  </form>
</div>

<div id="entrar" class="centro hidden">
  <form class="acceso" id="form-entrar">
    <h1 id="titulo-entrar">Documentación</h1>
    <p class="suave">Acceso del equipo.</p>
    <div id="error-entrar" class="error-caja hidden"></div>
    <label class="campo" for="ent-email">Correo</label>
    <input type="email" id="ent-email" autocomplete="username" required />
    <label class="campo" for="ent-pass">Contraseña</label>
    <input type="password" id="ent-pass" autocomplete="current-password" required />
    <button class="btn primario ancho" type="submit" id="btn-entrar">Entrar</button>
  </form>
</div>

<div id="app" class="hidden">
  <div class="barra">
    <a class="marca" href="#/panel" aria-label="3B Conecta, ir al resumen"><b id="nombre-marca">3B Conecta</b></a>
    <nav>
      <a href="#/panel" data-nav="panel">Resumen</a>
      <a href="#/revision" data-nav="revision">Por revisar <span class="n hidden" id="cnt-revision">0</span></a>
      <a href="#/empresas" data-nav="empresas">Empresas</a>
      <a href="#/trabajadores" data-nav="trabajadores">Trabajadores</a>
      <a href="#/actividad" data-nav="actividad">Actividad</a>
      <a href="#/ajustes" data-nav="ajustes">Requisitos</a>
    </nav>
    <div class="usuario"><span class="nombre" id="usuario"></span><button id="btn-salir">Salir</button></div>
  </div>
  <main id="vista"></main>
</div>

<div id="velo" class="hidden"><div id="ventana" role="dialog" aria-modal="true"></div></div>
<div id="aviso" class="hidden" role="status"></div>

<script>
// ───────────────────────── Configuración ─────────────────────────
// Pon aquí los datos de tu proyecto (Supabase → Project Settings → API). La clave "anon" es pública por
// diseño (es la misma que lleva la app): lo que protege los datos son las reglas de la base de datos.
// Si lo dejas sin rellenar, la página te los pedirá la primera vez y los guardará en este navegador.
const SUPABASE_URL = 'https://vvghqtwwrwdtekropavo.supabase.co';
const SUPABASE_ANON_KEY = 'PEGA_AQUI_TU_ANON_KEY';
const NOMBRE_MARCA = '3B Conecta';   // se cambia cuando esté el nombre final
const BUCKET = 'documentos-verificacion';

// ───────────────────────── Utilidades ─────────────────────────
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const aFecha = (d) => new Date(String(d).length === 10 ? d + 'T00:00:00' : d);
const fecha = (d) => { if (!d) return '—'; const x = aFecha(d); return isNaN(x) ? '—' : x.toLocaleDateString('es-ES'); };
const fechaHora = (d) => { if (!d) return '—'; const x = new Date(d); return isNaN(x) ? '—' : x.toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' }); };
const dias = (d) => { const h = new Date(); h.setHours(0, 0, 0, 0); return Math.round((aFecha(d) - h) / 864e5); };
const ETIQ_ROL = { arquitecto:'Arquitecto', profesional:'Profesional', promotor:'Promotor', constructora:'Constructora', proveedor:'Proveedor', administrador:'Inmobiliaria', subcontratista:'Oficios', referidor:'Recomendador' };
const DOC_ESTADO = { vigente:['ok','Vigente'], por_caducar:['aviso','Caduca pronto'], caducado:['mal','Caducado'], pendiente:['aviso','Pendiente de revisión'], rechazado:['mal','Rechazado'], faltante:['falta','Sin subir'] };
const SEM = { verde:['ok','Al día'], ambar:['aviso','Pendiente'], rojo:['mal','Incidencia'] };
const CUENTA = { verificada:['ok','Verificada'], pendiente:['aviso','Por verificar'], suspendida:['mal','Suspendida'] };
const ACCION = { documento_subido:'Subió', documento_aprobado:'Aprobó', documento_rechazado:'Rechazó' };
const marca = (par) => par ? `<span class="e ${par[0]}">${esc(par[1])}</span>` : '';
const estadoDoc = (k) => marca(DOC_ESTADO[k] || ['neutro', k]);
const semaforo = (k) => marca(SEM[k] || ['neutro', '—']);
const ordSem = { rojo: 0, ambar: 1, verde: 2 };
function mensajeError(e) {
  const m = (e && (e.message || e.error_description)) || String(e || 'Error');
  if (/No autorizado|No autenticado/i.test(m)) return 'Tu usuario no tiene permiso para hacer esto.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'No hay conexión con el servidor. Inténtalo de nuevo.';
  return m;
}
let temporizadorAviso;
function aviso(texto, error) {
  const a = $('#aviso'); a.textContent = texto; a.className = error ? 'error' : ''; clearTimeout(temporizadorAviso);
  temporizadorAviso = setTimeout(() => a.classList.add('hidden'), error ? 6000 : 3000);
}
function abrirVentana(html) { $('#ventana').innerHTML = html; $('#velo').classList.remove('hidden'); const p = $('#ventana input, #ventana textarea, #ventana select'); if (p) p.focus(); }
function cerrarVentana() { $('#velo').classList.add('hidden'); $('#ventana').innerHTML = ''; }
function guardarLocal(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function leerLocal(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function nombreSeguro(n) { return String(n || 'archivo').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9._-]+/g, '_').slice(-60); }
function caduca(f, est) {
  if (!f) return '<span class="suave">—</span>';
  const d = dias(f); const t = d < 0 ? `hace ${-d} día${d === -1 ? '' : 's'}` : d === 0 ? 'hoy' : `en ${d} día${d === 1 ? '' : 's'}`;
  return `${fecha(f)}<span class="sub ${d < 0 ? 'mal-t' : d <= 15 ? 'aviso-t' : ''}">${t}</span>`;
}

// ───────────────────────── Tablas ─────────────────────────
// cols: { t: título, f: fila → HTML, s: fila → valor para ordenar, cls }
const TABLAS = {}; const ORDEN = {};
function htmlTabla(id, cols, filas, vacio, ir) {
  TABLAS[id] = { cols, filas, vacio, ir };
  if (!filas.length) return `<div class="vacio" id="t-${id}">${esc(vacio)}</div>`;
  const o = ORDEN[id];
  let datos = filas;
  if (o && cols[o.i] && cols[o.i].s) {
    const s = cols[o.i].s; const dir = o.dir === 'asc' ? 1 : -1;
    datos = [...filas].sort((a, b) => { const x = s(a), y = s(b); return (x == null ? 1 : y == null ? -1 : x < y ? -1 : x > y ? 1 : 0) * dir; });
  }
  return `<div class="tabla-caja" id="t-${id}"><table class="t"><thead><tr>${cols.map((c, i) =>
    `<th class="${c.cls || ''}" ${c.s ? `data-ord="${id}:${i}"` : ''} ${o && o.i === i ? `aria-sort="${o.dir === 'asc' ? 'ascending' : 'descending'}"` : ''}>${esc(c.t)}</th>`).join('')}</tr></thead><tbody>${
    datos.map((r) => `<tr ${ir ? `class="clic" data-ir="${esc(ir(r))}"` : ''}>${cols.map((c, i) =>
      `<td class="${(c.cls || '') + (i === 0 ? ' prim' : '')}" data-l="${esc(c.t)}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
document.addEventListener('click', (e) => {
  const th = e.target.closest('th[data-ord]');
  if (th) {
    const [id, i] = th.dataset.ord.split(':'); const o = ORDEN[id];
    ORDEN[id] = { i: +i, dir: o && o.i === +i && o.dir === 'asc' ? 'desc' : 'asc' };
    const t = TABLAS[id]; $('#t-' + id).outerHTML = htmlTabla(id, t.cols, t.filas, t.vacio, t.ir); return;
  }
  const ir = e.target.closest('tr[data-ir]');
  if (ir && !e.target.closest('button, a')) location.hash = ir.dataset.ir;
});

// ───────────────────────── Datos ─────────────────────────
let sb = null; let yo = null; let cacheEmpresas = null;
async function rpc(nombre, args) { const { data, error } = await sb.rpc(nombre, args || {}); if (error) throw error; return data; }
async function empresas(forzar) { if (forzar || !cacheEmpresas) cacheEmpresas = await rpc('panel_empresas'); return cacheEmpresas; }
function invalidar() { cacheEmpresas = null; actualizarContador(); }
async function actualizarContador() {
  try { const r = await rpc('panel_resumen'); const c = $('#cnt-revision'); c.textContent = r.por_revisar; c.classList.toggle('hidden', !r.por_revisar); } catch (e) {}
}
async function verArchivo(ruta) {
  const w = window.open('', '_blank');
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(ruta, 300);
  if (error || !data) { if (w) w.close(); aviso('No se ha podido abrir el archivo. Inténtalo de nuevo.', true); return; }
  if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
}

// ───────────────────────── Entrada y arranque ─────────────────────────
function mostrarSolo(id) { ['config', 'entrar', 'app'].forEach((x) => $('#' + x).classList.toggle('hidden', x !== id)); }
function claves() {
  if (SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.startsWith('PEGA_AQUI')) return { url: SUPABASE_URL, key: SUPABASE_ANON_KEY };
  const u = leerLocal('panel_url'), k = leerLocal('panel_key'); return u && k ? { url: u, key: k } : null;
}
async function arrancar() {
  document.title = 'Documentación · ' + NOMBRE_MARCA; $('#nombre-marca').textContent = NOMBRE_MARCA;
  const c = claves(); if (!c) { mostrarSolo('config'); return; }
  sb = window.supabase.createClient(c.url, c.key, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data } = await sb.auth.getSession();
  if (data && data.session) await entrarComo(data.session.user); else mostrarSolo('entrar');
}
async function entrarComo(user) {
  const { data, error } = await sb.from('profiles').select('id, role, nombre_completo, email').eq('id', user.id).maybeSingle();
  if (error || !data || !['admin', 'superadmin'].includes(data.role)) {
    await sb.auth.signOut(); mostrarSolo('entrar');
    const e = $('#error-entrar'); e.textContent = 'Este usuario no tiene acceso a la documentación.'; e.classList.remove('hidden'); return;
  }
  yo = data; $('#usuario').textContent = data.nombre_completo || data.email || '';

async function enrutar() {
  if (!yo) return;
  const partes = (location.hash || '#/panel').replace(/^#\//, '').split('?')[0].split('/');
  const ruta = partes[0] || 'panel', id = partes[1];
  const activa = ruta === 'empresa' ? 'empresas' : ruta === 'trabajador' ? 'trabajadores' : ruta;
  document.querySelectorAll('[data-nav]').forEach((a) => a.classList.toggle('activo', a.dataset.nav === activa));
  const v = $('#vista'); v.innerHTML = '<div class="cargando">Cargando…</div>'; window.scrollTo(0, 0);
  try {
    if (ruta === 'panel') await vistaResumen(v);
    else if (ruta === 'revision') await vistaRevision(v);
    else if (ruta === 'empresas') await vistaEmpresas(v);
    else if (ruta === 'empresa') await vistaEmpresa(v, id, partes[2]);
    else if (ruta === 'trabajadores') await vistaTrabajadores(v);
    else if (ruta === 'trabajador') await vistaTrabajador(v, id);
    else if (ruta === 'actividad') await vistaActividad(v);
    else if (ruta === 'ajustes') await vistaRequisitos(v);
    else location.hash = '#/panel';
  } catch (e) { v.innerHTML = `<div class="error-caja">${esc(mensajeError(e))}</div>`; }
}
window.addEventListener('hashchange', enrutar);
const recargar = () => { invalidar(); return enrutar(); };

  <div class="cab"><div><h1>${esc(t.nombre)} ${esc(t.apellidos || '')}</h1><p>${t.activo ? semaforo(t.semaforo) : '<span class="e neutro">Baja</span>'}</p></div>
    <button class="btn" data-act="editar-trabajador">Editar datos</button></div>
  <div class="ficha"><div class="panel"><header><h2>Datos</h2></header><div class="cuerpo">${listaDatos([
    ['DNI o NIE', esc(t.dni)], ['Puesto', esc(t.puesto || '—')], ['Empresa', `<a href="#/empresa/${esc(t.profile_id)}">${esc(t.empresa || t.cuenta || '—')}</a>`],
    ['Fecha de alta', fecha(t.fecha_alta)], ['Teléfono', esc(t.telefono || '—')], ['Correo', esc(t.email || '—')], ['Notas', esc(t.notas || '—')]])}</div></div>
    <div><div class="panel"><header><h2>Documentos</h2></header>${tablaDocumentos('docs', docs, ctx)}</div>
    <div class="panel" style="margin-top:16px"><header><h2>Actividad</h2></header>${tablaActividad('act', act, false)}</div></div></div>`;
}

async function vistaActividad(v) {
  const act = await rpc('panel_actividad', { p_limite: 200, p_profile_id: null });
  v.innerHTML = `<div class="cab"><div><h1>Actividad</h1><p class="suave">Quién ha subido, aprobado o rechazado cada documento. Últimos 200 movimientos.</p></div></div>
  <div class="panel">${tablaActividad('actglobal', act, true)}</div>`;
}

async function vistaRequisitos(v) {
  const [a, b] = await Promise.all([sb.from('documentos_requeridos').select('*').order('role').order('orden'), sb.from('documentos_trabajador_requeridos').select('*').order('orden')]);
  if (a.error) throw a.error; if (b.error) throw b.error;
  window.__req = { a: a.data, b: b.data };
  const porRol = {}; a.data.forEach((d) => (porRol[d.role] = porRol[d.role] || []).push(d));
  const tabla = (id, filas, tabla_, clave) => htmlTabla(id, [
    { t: 'Documento', f: (d) => `<b>${esc(d.etiqueta)}</b>` },
    { t: 'Obligatorio', f: (d) => d.obligatorio ? 'Sí' : 'No' },
    { t: 'Validez', f: (d) => d.vigencia_meses ? `${d.vigencia_meses} meses` : 'No caduca' },
    { t: '', cls: 'acc', f: (d) => `<button class="btn peq" data-act="editar-requisito" data-tabla="${tabla_}" data-clave='${esc(JSON.stringify(clave(d)))}'>Editar</button>` }], filas, 'No se pide ningún documento.');
  v.innerHTML = `<div class="cab"><div><h1>Requisitos</h1><p class="suave">Qué documentos se piden a cada perfil y a los trabajadores, y cuántos meses vale cada uno. Los cambios afectan a lo que se apruebe a partir de ahora.</p></div></div>
  <div class="panel"><header><h2>Trabajadores</h2></header>${tabla('rq-t', b.data, 'documentos_trabajador_requeridos', (d) => ({ tipo: d.tipo }))}</div>
  ${Object.keys(porRol).map((r) => `<div class="panel" style="margin-top:16px"><header><h2>${esc(ETIQ_ROL[r] || r)}</h2></header>${tabla('rq-' + r, porRol[r], 'documentos_requeridos', (d) => ({ role: d.role, tipo: d.tipo }))}</div>`).join('')}`;
}

// ───────────────────────── Acciones ─────────────────────────
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act; const ctx = b.dataset.ctx ? JSON.parse(b.dataset.ctx) : null;
  try {
    if (act === 'ver') return verArchivo(b.dataset.ruta);
    if (act === 'aprobar') return ventanaAprobar(b.dataset.doc, ctx);
    if (act === 'rechazar') return ventanaRechazar(b.dataset.doc, ctx);
    if (act === 'caducidad') return ventanaCaducidad(b.dataset.doc, ctx, b.dataset.fecha);
    if (act === 'historial') return ventanaHistorial(ctx, b.dataset.tipo);
    if (act === 'subir') return ventanaSubir(ctx, b.dataset.tipo, b.dataset.etiqueta);
    if (act === 'estado-cuenta') return ventanaEstadoCuenta(b.dataset.id, b.dataset.nuevo);
    if (act === 'nuevo-trabajador') return ventanaTrabajador(null, b.dataset.id);
    if (act === 'editar-trabajador') return ventanaTrabajador(window.__trab, window.__trab.profile_id);
    if (act === 'editar-requisito') return ventanaRequisito(b.dataset.tabla, JSON.parse(b.dataset.clave));
  } catch (err) { aviso(mensajeError(err), true); }
});
function errorVentana(err) { const x = $('#v-error'); x.textContent = mensajeError(err); x.classList.remove('hidden'); }
const pieVentana = (ok, clase) => `<div id="v-error" class="error-caja hidden"></div><div class="pie-modal"><button class="btn" data-cerrar>Cancelar</button><button class="btn ${clase}" id="v-ok">${ok}</button></div>`;

function ventanaAprobar(docId, ctx) {
  abrirVentana(`<h2>${ctx.renovacion ? 'Aprobar renovación' : 'Aprobar documento'}</h2><p class="suave">${ctx.renovacion ? 'El archivo anterior pasa al historial y la caducidad se cuenta desde hoy. ' : ''}La caducidad se calcula sola según los meses que vale este documento. Si el documento trae otra fecha, indícala.</p>
    <label class="campo" for="v-fecha">Fecha de caducidad (opcional)</label><input type="date" id="v-fecha" />${pieVentana('Aprobar', 'primario')}`);
  $('[data-cerrar]').onclick = cerrarVentana;
  $('#v-ok').onclick = async () => {
    const f = $('#v-fecha').value || null; $('#v-ok').disabled = true;
    try {
      if (ctx.renovacion) await rpc('panel_resolver_renovacion', { p_origen: ctx.origen, p_documento_id: docId, p_aprobar: true, p_motivo: null, p_caduca_en: f });
      else if (ctx.origen === 'trabajador') await rpc('panel_revisar_documento_trabajador', { p_documento_id: docId, p_aprobar: true, p_motivo: null, p_caduca_en: f });
      else { await rpc('revisar_documento_cuenta', { p_documento_id: docId, p_aprobar: true, p_motivo: null }); if (f) await rpc('panel_fijar_caducidad', { p_origen: 'cuenta', p_documento_id: docId, p_fecha: f }); }
      cerrarVentana(); aviso(ctx.renovacion ? 'Renovación aprobada.' : 'Documento aprobado.'); recargar();
    } catch (err) { $('#v-ok').disabled = false; errorVentana(err); }
  };
}
function ventanaRechazar(docId, ctx) {
  abrirVentana(`<h2>${ctx.renovacion ? 'Rechazar renovación' : 'Rechazar documento'}</h2><p class="suave">El motivo le llega a la persona como aviso en la app.${ctx.renovacion ? ' El documento anterior sigue vigente.' : ''}</p>
    <label class="campo" for="v-motivo">Motivo</label><textarea id="v-motivo" placeholder="Por ejemplo: está caducado, no se lee o falta la segunda cara"></textarea>${pieVentana('Rechazar', 'mal')}`);
  $('[data-cerrar]').onclick = cerrarVentana;
  $('#v-ok').onclick = async () => {
    const m = $('#v-motivo').value.trim(); $('#v-ok').disabled = true;
    try {
      if (ctx.renovacion) await rpc('panel_resolver_renovacion', { p_origen: ctx.origen, p_documento_id: docId, p_aprobar: false, p_motivo: m, p_caduca_en: null });
      else if (ctx.origen === 'trabajador') await rpc('panel_revisar_documento_trabajador', { p_documento_id: docId, p_aprobar: false, p_motivo: m, p_caduca_en: null });
      else await rpc('revisar_documento_cuenta', { p_documento_id: docId, p_aprobar: false, p_motivo: m });
      cerrarVentana(); aviso(ctx.renovacion ? 'Renovación rechazada.' : 'Documento rechazado.'); recargar();
    } catch (err) { $('#v-ok').disabled = false; errorVentana(err); }
  };
}
function ventanaCaducidad(docId, ctx, actual) {
  abrirVentana(`<h2>Cambiar la caducidad</h2><label class="campo" for="v-fecha">Caduca el</label><input type="date" id="v-fecha" value="${esc(actual || '')}" />${pieVentana('Guardar', 'primario')}`);
  $('[data-cerrar]').onclick = cerrarVentana;
  $('#v-ok').onclick = async () => {
    $('#v-ok').disabled = true;
    try { await rpc('panel_fijar_caducidad', { p_origen: ctx.origen, p_documento_id: docId, p_fecha: $('#v-fecha').value || null }); cerrarVentana(); aviso('Caducidad guardada.'); recargar(); }
    catch (err) { $('#v-ok').disabled = false; errorVentana(err); }
  };
}
async function ventanaHistorial(ctx, tipo) {
  abrirVentana('<h2>Historial de archivos</h2><div class="cargando">Cargando…</div>');
  const h = await rpc('panel_historial_documento', { p_origen: ctx.origen, p_profile_id: ctx.profile || null, p_trabajador_id: ctx.trabajador || null, p_tipo: tipo });
  $('#ventana').innerHTML = '<h2>Historial de archivos</h2>' + htmlTabla('hist', [
    { t: 'Archivo', f: (x) => esc(x.nombre_archivo) }, { t: 'Subido', f: (x) => fechaHora(x.subido_en) }, { t: 'Sustituido', f: (x) => fechaHora(x.archivado_en) },
    { t: '', cls: 'acc', f: (x) => `<button class="btn peq" data-act="ver" data-ruta="${esc(x.storage_path)}">Ver</button>` }], h, 'Todavía no se ha sustituido ningún archivo.') +
    '<div class="pie-modal"><button class="btn" data-cerrar>Cerrar</button></div>';
  $('[data-cerrar]').onclick = cerrarVentana;
}
function ventanaSubir(ctx, tipo, etiqueta) {
  abrirVentana(`<h2>Subir ${esc(etiqueta)}</h2><p class="suave">Para cuando lo mandan por correo. PDF o imagen, hasta 10 MB.</p>
    <label class="campo" for="v-archivo">Archivo</label><input type="file" id="v-archivo" accept="application/pdf,image/jpeg,image/png,image/webp" />
    <label style="display:block;margin-top:14px"><input type="checkbox" id="v-aprobar" checked /> Aprobarlo al subirlo</label>
    <label class="campo" for="v-fecha">Fecha de caducidad (opcional)</label><input type="date" id="v-fecha" />${pieVentana('Subir', 'primario')}`);
  $('[data-cerrar]').onclick = cerrarVentana;
  $('#v-ok').onclick = async () => {
    const f = $('#v-archivo').files[0]; $('#v-error').classList.add('hidden');
    if (!f) return errorVentana('Elige un archivo.');
    if (f.size > 10 * 1024 * 1024) return errorVentana('El archivo pesa más de 10 MB.');
    $('#v-ok').disabled = true; $('#v-ok').textContent = 'Subiendo…';
    const ruta = `${ctx.profile}/${ctx.origen === 'trabajador' ? 'trab-' + ctx.trabajador + '-' : ''}${tipo}-${Date.now()}-${nombreSeguro(f.name)}`;
    try {
      const { error } = await sb.storage.from(BUCKET).upload(ruta, f, { contentType: f.type, upsert: false }); if (error) throw error;
      await rpc('panel_subir_documento', { p_tipo: tipo, p_profile_id: ctx.profile, p_trabajador_id: ctx.trabajador || null, p_nombre: f.name, p_ruta: ruta, p_mime: f.type, p_aprobar: $('#v-aprobar').checked, p_caduca_en: $('#v-fecha').value || null });
      cerrarVentana(); aviso('Documento subido.'); recargar();
    } catch (err) { $('#v-ok').disabled = false; $('#v-ok').textContent = 'Subir'; errorVentana(err); }
  };
}
function ventanaEstadoCuenta(id, nuevo) {
  const verif = nuevo === 'verificada';
  abrirVentana(`<h2>${verif ? 'Verificar la cuenta' : 'Suspender la cuenta'}</h2>
    <p class="suave">${verif ? 'La persona podrá usar la app con normalidad.' : 'La persona dejará de poder usar la app y recibirá el motivo.'}</p>
    ${verif ? '' : '<label class="campo" for="v-motivo">Motivo</label><textarea id="v-motivo"></textarea>'}${pieVentana(verif ? 'Verificar' : 'Suspender', verif ? 'primario' : 'mal')}`);
  $('[data-cerrar]').onclick = cerrarVentana;
  $('#v-ok').onclick = async () => {
    $('#v-ok').disabled = true;
    try { await rpc('cambiar_estado_cuenta', { p_profile_id: id, p_nuevo_estado: nuevo, p_motivo: verif ? null : ($('#v-motivo').value.trim() || null) }); cerrarVentana(); aviso('Cuenta actualizada.'); recargar(); }
    catch (err) { $('#v-ok').disabled = false; errorVentana(err); }
  };
}
async function ventanaTrabajador(t, profileId) {
  const cuentas = await empresas();
  const c = (k) => esc(t ? t[k] || '' : '');
  abrirVentana(`<h2>${t ? 'Editar trabajador' : 'Añadir trabajador'}</h2>
    ${t ? '' : `<label class="campo" for="t-cuenta">Cuenta</label><select id="t-cuenta"><option value="">Elige una cuenta</option>${cuentas.map((x) => `<option value="${esc(x.profile_id)}" ${x.profile_id === profileId ? 'selected' : ''}>${esc(x.empresa || x.nombre_completo)} (${esc(ETIQ_ROL[x.role] || x.role)})</option>`).join('')}</select>`}
    <div class="form-rejilla"><div><label class="campo" for="t-nombre">Nombre</label><input type="text" id="t-nombre" value="${c('nombre')}" /></div>
    <div><label class="campo" for="t-apellidos">Apellidos</label><input type="text" id="t-apellidos" value="${c('apellidos')}" /></div>
    <div><label class="campo" for="t-dni">DNI o NIE</label><input type="text" id="t-dni" value="${c('dni')}" /></div>
    <div><label class="campo" for="t-puesto">Puesto</label><input type="text" id="t-puesto" value="${c('puesto')}" /></div>
    <div><label class="campo" for="t-tel">Teléfono</label><input type="text" id="t-tel" value="${c('telefono')}" /></div>
    <div><label class="campo" for="t-email">Correo</label><input type="email" id="t-email" value="${c('email')}" /></div>
    <div><label class="campo" for="t-alta">Fecha de alta</label><input type="date" id="t-alta" value="${t && t.fecha_alta ? esc(t.fecha_alta) : ''}" /></div></div>
    <label class="campo" for="t-notas">Notas</label><textarea id="t-notas">${c('notas')}</textarea>
    <label style="display:block;margin-top:14px"><input type="checkbox" id="t-activo" ${!t || t.activo ? 'checked' : ''} /> En activo (desmárcalo si causa baja)</label>${pieVentana('Guardar', 'primario')}`);
  $('[data-cerrar]').onclick = cerrarVentana;
  $('#v-ok').onclick = async () => {
    $('#v-ok').disabled = true;
    try {
      const id = await rpc('panel_guardar_trabajador', { p_id: t ? t.id : null, p_profile_id: t ? t.profile_id : $('#t-cuenta').value || null,
        p_nombre: $('#t-nombre').value, p_apellidos: $('#t-apellidos').value, p_dni: $('#t-dni').value, p_puesto: $('#t-puesto').value,
        p_telefono: $('#t-tel').value, p_email: $('#t-email').value, p_fecha_alta: $('#t-alta').value || null, p_activo: $('#t-activo').checked, p_notas: $('#t-notas').value });
      cerrarVentana(); aviso('Trabajador guardado.'); invalidar();
      if (!t) location.hash = '#/trabajador/' + id; else enrutar();
    } catch (err) { $('#v-ok').disabled = false; errorVentana(err); }
  };
}
function ventanaRequisito(tabla, clave) {
  const lista = tabla === 'documentos_requeridos' ? window.__req.a : window.__req.b;
  const d = lista.find((x) => x.tipo === clave.tipo && (!clave.role || x.role === clave.role));
  abrirVentana(`<h2>${esc(d.etiqueta)}</h2><label class="campo" for="r-meses">Meses de validez (0 si no caduca)</label><input type="number" id="r-meses" min="0" max="120" value="${esc(d.vigencia_meses)}" />
    <label style="display:block;margin-top:14px"><input type="checkbox" id="r-oblig" ${d.obligatorio ? 'checked' : ''} /> Es obligatorio</label>${pieVentana('Guardar', 'primario')}`);
  $('[data-cerrar]').onclick = cerrarVentana;
  $('#v-ok').onclick = async () => {
    const meses = parseInt($('#r-meses').value, 10);
    if (isNaN(meses) || meses < 0) return errorVentana('Escribe los meses de validez (0 o más).');
    $('#v-ok').disabled = true;
    let q = sb.from(tabla).update({ vigencia_meses: meses, obligatorio: $('#r-oblig').checked }).eq('tipo', clave.tipo); if (clave.role) q = q.eq('role', clave.role);
    const { error } = await q;
    if (error) { $('#v-ok').disabled = false; return errorVentana(error); }
    cerrarVentana(); aviso('Cambios guardados.'); recargar();
  };
}

arrancar();
</script>
